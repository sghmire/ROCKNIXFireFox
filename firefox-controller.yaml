# InputPlumber profile for desktop Firefox on a handheld.
version: 1
kind: DeviceProfile
name: Firefox Browser
description: Retroid controller mapping for Firefox on ROCKNIX

target_devices:
  - mouse
  - keyboard

mapping:
  - name: Pointer
    source_event:
      gamepad:
        axis:
          name: RightStick
    target_events:
      - mouse:
          motion:
            speed_pps: 700

  - name: Primary click
    source_event:
      gamepad:
        button: South
    target_events:
      - mouse:
          button: Left

  - name: Primary click trigger
    source_event:
      gamepad:
        trigger:
          name: RightTrigger
          deadzone: 0.25
    target_events:
      - mouse:
          button: Left

  - name: Secondary click
    source_event:
      gamepad:
        trigger:
          name: LeftTrigger
          deadzone: 0.25
    target_events:
      - mouse:
          button: Right

  - name: Browser back
    source_event:
      gamepad:
        button: East
    target_events:
      - keyboard: KeyLeftAlt
      - keyboard: KeyLeft

  - name: Reload
    source_event:
      gamepad:
        button: West
    target_events:
      - keyboard: KeyF5

  - name: Toggle onscreen keyboard
    source_event:
      gamepad:
        button: North
    target_events:
      - keyboard: KeyF12

  - name: Exit Firefox
    source_event:
      gamepad:
        button: Guide
    target_events:
      - keyboard: KeyF9

  - name: Confirm
    source_event:
      gamepad:
        button: Start
    target_events:
      - keyboard: KeyEnter

  - name: Next control
    source_event:
      gamepad:
        button: Select
    target_events:
      - keyboard: KeyTab

  - name: Up
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - keyboard: KeyUp

  - name: Down
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - keyboard: KeyDown

  - name: Left
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - keyboard: KeyLeft

  - name: Right
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - keyboard: KeyRight

  - name: Scroll up
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - mouse:
          button: WheelUp

  - name: Scroll down
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - mouse:
          button: WheelDown

  - name: Page up
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: up
          deadzone: 0.35
    target_events:
      - keyboard: KeyPageUp

  - name: Page down
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: down
          deadzone: 0.35
    target_events:
      - keyboard: KeyPageDown
